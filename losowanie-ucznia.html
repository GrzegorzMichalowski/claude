<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Losowanie Ucznia</title>
    <meta name="theme-color" content="#1a1a2e">
    <link rel="stylesheet" href="styles-common.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <style>
        /* Nadpisanie dla tej strony */
        body {
            background: var(--gradient-dark);
            padding: var(--spacing-lg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 400px;
            width: 100%;
        }

        .home-btn {
            display: inline-block;
            margin-bottom: 15px;
            padding: 8px 16px;
            background: #ffd700;
            color: #1a1a2e;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .home-btn:hover {
            background: #ffed4a;
        }

        h1 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 25px;
            font-size: 1.5rem;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
        }

        .machine {
            background: linear-gradient(180deg, #2d2d2d 0%, #1a1a1a 100%);
            border-radius: 20px;
            padding: 25px;
            box-shadow:
                0 10px 40px rgba(0,0,0,0.5),
                inset 0 2px 0 rgba(255,255,255,0.1),
                inset 0 -2px 0 rgba(0,0,0,0.3);
            border: 3px solid #444;
        }

        .settings {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .settings label {
            color: #ccc;
            font-size: 0.9rem;
        }

        .settings input[type="number"] {
            width: 70px;
            padding: 8px;
            font-size: 1.1rem;
            border: 2px solid #555;
            border-radius: 8px;
            text-align: center;
            background: #333;
            color: #fff;
        }

        .settings input[type="number"]:focus {
            outline: none;
            border-color: #ffd700;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .display-container {
            background: #111;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 4px solid #333;
            box-shadow: inset 0 5px 20px rgba(0,0,0,0.8);
        }

        .display {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .display-number {
            font-size: 5rem;
            font-weight: 800;
            color: #ffd700;
            text-shadow:
                0 0 20px rgba(255, 215, 0, 0.8),
                0 0 40px rgba(255, 215, 0, 0.4);
            font-family: 'Courier New', monospace;
        }

        .display-number.spinning {
            animation: spin 0.1s linear infinite;
        }

        @keyframes spin {
            0% { transform: translateY(-20px); opacity: 0.5; }
            50% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(20px); opacity: 0.5; }
        }

        .display-number.winner {
            animation: winner 0.5s ease-out;
            color: #00ff88;
            text-shadow:
                0 0 20px rgba(0, 255, 136, 0.8),
                0 0 40px rgba(0, 255, 136, 0.4);
        }

        @keyframes winner {
            0% { transform: scale(1.5); }
            50% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        .display-label {
            text-align: center;
            color: #666;
            font-size: 0.8rem;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .spin-btn {
            width: 100%;
            padding: 18px;
            font-size: 1.4rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: linear-gradient(180deg, #ff6b6b 0%, #c0392b 100%);
            color: white;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow:
                0 6px 0 #922b21,
                0 10px 20px rgba(0,0,0,0.3);
            transition: all 0.1s;
            margin-bottom: 20px;
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow:
                0 8px 0 #922b21,
                0 15px 30px rgba(0,0,0,0.4);
        }

        .spin-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow:
                0 2px 0 #922b21,
                0 5px 10px rgba(0,0,0,0.3);
        }

        .spin-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .info-panel {
            background: #222;
            border-radius: 12px;
            padding: 15px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #888;
            font-size: 0.85rem;
        }

        .info-value {
            color: #fff;
            font-weight: 600;
        }

        .absent-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #333;
        }

        .absent-label {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 10px;
            display: block;
        }

        .absent-input {
            width: 100%;
            padding: 10px;
            font-size: 0.9rem;
            border: 2px solid #444;
            border-radius: 8px;
            background: #333;
            color: #fff;
        }

        .absent-input:focus {
            outline: none;
            border-color: #ffd700;
        }

        .absent-hint {
            color: #666;
            font-size: 0.75rem;
            margin-top: 5px;
        }

        .history-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #333;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .history-label {
            color: #888;
            font-size: 0.85rem;
        }

        .clear-btn {
            background: none;
            border: none;
            color: #ff6b6b;
            font-size: 0.75rem;
            cursor: pointer;
            text-decoration: underline;
        }

        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .history-item {
            background: #333;
            color: #ffd700;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .history-empty {
            color: #555;
            font-size: 0.8rem;
        }

        .reset-btn {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            font-size: 0.9rem;
            border: 2px solid #555;
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
            color: #888;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            border-color: #ffd700;
            color: #ffd700;
        }

        /* ============================================
           RESPONSIVE - KRYTYCZNE!
           ============================================ */

        /* Tablet: 768px i mniej */
        @media (max-width: 768px) {
            body {
                padding: var(--spacing-md);
            }

            .machine {
                padding: 20px;
            }

            .display-number {
                font-size: 4rem;
            }
        }

        /* Mobile: 480px i mniej */
        @media (max-width: 480px) {
            body {
                padding: var(--spacing-sm);
                align-items: flex-start;
                padding-top: var(--spacing-md);
            }

            .container {
                max-width: 100%;
            }

            h1 {
                font-size: 1.2rem;
                margin-bottom: 15px;
            }

            .machine {
                padding: 15px;
                border-radius: 15px;
            }

            .settings {
                flex-direction: column;
                gap: 10px;
            }

            .settings input[type="number"] {
                width: 80px;
                min-height: var(--touch-target-min);
            }

            .checkbox-wrapper {
                min-height: var(--touch-target-min);
            }

            .checkbox-wrapper input[type="checkbox"] {
                width: 24px;
                height: 24px;
            }

            .display-container {
                padding: 15px;
                margin-bottom: 15px;
            }

            .display {
                height: 80px;
            }

            .display-number {
                font-size: clamp(2.5rem, 15vw, 4rem);
            }

            .spin-btn {
                padding: 15px;
                font-size: 1.2rem;
                min-height: var(--touch-target-min);
            }

            .info-panel {
                padding: 12px;
            }

            .info-row {
                padding: 6px 0;
            }

            .absent-input {
                min-height: var(--touch-target-min);
            }

            .reset-btn {
                min-height: var(--touch-target-min);
            }

            .history-item {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
        }

        /* Bardzo małe ekrany: 320px */
        @media (max-width: 320px) {
            .display-number {
                font-size: 2rem;
            }

            h1 {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="home-btn">&#8592; Strona główna</a>
        <h1>🎰 Losowanie Ucznia</h1>

        <div class="machine">
            <div class="settings">
                <label for="studentCount">Uczniów:</label>
                <input type="number" id="studentCount" min="2" max="40" value="25">

                <div class="checkbox-wrapper">
                    <input type="checkbox" id="noRepeat" checked>
                    <label for="noRepeat">Bez powtórzeń</label>
                </div>
            </div>

            <div class="display-container">
                <div class="display">
                    <div class="display-number" id="displayNumber">?</div>
                </div>
                <div class="display-label">Numer z dziennika</div>
            </div>

            <button class="spin-btn" id="spinBtn">🎰 Losuj!</button>

            <div class="info-panel">
                <div class="info-row">
                    <span class="info-label">Dostępnych:</span>
                    <span class="info-value" id="availableCount">25</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Wylosowanych:</span>
                    <span class="info-value" id="drawnCount">0</span>
                </div>

                <div class="absent-section">
                    <label class="absent-label">Nieobecni (wykluczeni):</label>
                    <input type="text" class="absent-input" id="absentInput" placeholder="np. 3, 7, 15">
                    <div class="absent-hint">Numery oddzielone przecinkami</div>
                </div>

                <div class="history-section">
                    <div class="history-header">
                        <span class="history-label">Historia losowań:</span>
                        <button class="clear-btn" id="clearHistoryBtn">Wyczyść</button>
                    </div>
                    <div class="history-list" id="historyList">
                        <span class="history-empty">-</span>
                    </div>
                </div>

                <button class="reset-btn" id="resetBtn">🔄 Resetuj losowania (zacznij od nowa)</button>
            </div>
        </div>

        <div style="text-align: center; margin-top: 15px; font-size: 0.8rem;">
            <a href="https://grzegorz-nauczyciel.goatcounter.com" target="_blank" style="color: #ffd700;">Statystyki odwiedzin</a>
        </div>
    </div>

    <script>
        // Stałe
        const HISTORY_LIMIT = 100; // Limit historii dla zapobiegania memory leak

        // Stan
        let totalStudents = 25;
        let drawnNumbers = [];
        let absentNumbers = [];
        let isSpinning = false;

        // Elementy DOM (cache)
        let elements = {};

        function cacheElements() {
            elements = {
                studentCount: document.getElementById('studentCount'),
                noRepeat: document.getElementById('noRepeat'),
                absentInput: document.getElementById('absentInput'),
                spinBtn: document.getElementById('spinBtn'),
                displayNumber: document.getElementById('displayNumber'),
                availableCount: document.getElementById('availableCount'),
                drawnCount: document.getElementById('drawnCount'),
                historyList: document.getElementById('historyList'),
                clearHistoryBtn: document.getElementById('clearHistoryBtn'),
                resetBtn: document.getElementById('resetBtn')
            };
        }

        function getAvailableNumbers() {
            const all = Array.from({ length: totalStudents }, (_, i) => i + 1);
            const noRepeat = elements.noRepeat?.checked ?? true;

            return all.filter(n => {
                if (absentNumbers.includes(n)) return false;
                if (noRepeat && drawnNumbers.includes(n)) return false;
                return true;
            });
        }

        function updateSettings() {
            totalStudents = parseInt(elements.studentCount?.value) || 25;

            const absentInput = elements.absentInput?.value || '';
            absentNumbers = absentInput
                .split(',')
                .map(n => parseInt(n.trim()))
                .filter(n => !isNaN(n) && n >= 1 && n <= totalStudents);

            updateDisplay();
        }

        function updateDisplay() {
            const available = getAvailableNumbers();

            if (elements.availableCount) {
                elements.availableCount.textContent = available.length;
            }
            if (elements.drawnCount) {
                elements.drawnCount.textContent = drawnNumbers.length;
            }

            if (elements.spinBtn) {
                if (available.length === 0) {
                    elements.spinBtn.disabled = true;
                    elements.spinBtn.textContent = 'Brak dostępnych';
                } else {
                    elements.spinBtn.disabled = isSpinning;
                    elements.spinBtn.textContent = '🎰 Losuj!';
                }
            }
        }

        function spin() {
            const available = getAvailableNumbers();
            if (isSpinning || available.length === 0) return;

            isSpinning = true;
            if (elements.spinBtn) elements.spinBtn.disabled = true;

            const display = elements.displayNumber;
            if (!display) return;

            display.classList.remove('winner');
            display.classList.add('spinning');

            // Spinning animation
            let spinCount = 0;
            const spinInterval = setInterval(() => {
                display.textContent = available[Math.floor(Math.random() * available.length)];
                spinCount++;
            }, 50);

            // Slow down and stop
            setTimeout(() => {
                clearInterval(spinInterval);

                // Final slower spins
                let slowSpins = 0;
                const slowInterval = setInterval(() => {
                    display.textContent = available[Math.floor(Math.random() * available.length)];
                    slowSpins++;
                    if (slowSpins >= 10) {
                        clearInterval(slowInterval);

                        // Final result
                        const winner = available[Math.floor(Math.random() * available.length)];
                        display.textContent = winner;
                        display.classList.remove('spinning');
                        display.classList.add('winner');

                        // Dodaj do historii z limitem
                        drawnNumbers.push(winner);
                        if (drawnNumbers.length > HISTORY_LIMIT) {
                            drawnNumbers = drawnNumbers.slice(-HISTORY_LIMIT);
                        }

                        updateHistory();
                        updateDisplay();

                        isSpinning = false;
                    }
                }, 100 + slowSpins * 30);
            }, 1000);
        }

        function updateHistory() {
            if (!elements.historyList) return;

            if (drawnNumbers.length === 0) {
                elements.historyList.innerHTML = '<span class="history-empty">-</span>';
                return;
            }

            elements.historyList.innerHTML = drawnNumbers
                .slice()
                .reverse()
                .slice(0, 50) // Pokazuj max 50 ostatnich w UI
                .map(n => `<span class="history-item">${n}</span>`)
                .join('');
        }

        function clearHistory() {
            drawnNumbers = [];
            if (elements.displayNumber) {
                elements.displayNumber.textContent = '?';
                elements.displayNumber.classList.remove('winner');
            }
            updateHistory();
            updateDisplay();
        }

        // Inicjalizacja po załadowaniu DOM
        document.addEventListener('DOMContentLoaded', function() {
            cacheElements();

            // Event listeners
            if (elements.studentCount) {
                elements.studentCount.addEventListener('change', updateSettings);
                elements.studentCount.addEventListener('input', updateSettings);
            }

            if (elements.noRepeat) {
                elements.noRepeat.addEventListener('change', updateSettings);
            }

            if (elements.absentInput) {
                elements.absentInput.addEventListener('change', updateSettings);
                elements.absentInput.addEventListener('input', updateSettings);
            }

            if (elements.spinBtn) {
                elements.spinBtn.addEventListener('click', spin);
            }

            if (elements.clearHistoryBtn) {
                elements.clearHistoryBtn.addEventListener('click', clearHistory);
            }

            if (elements.resetBtn) {
                elements.resetBtn.addEventListener('click', clearHistory);
            }

            // Początkowa konfiguracja
            updateSettings();
        });
    </script>

    <script data-goatcounter="https://grzegorz-nauczyciel.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
