<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Kółko i Krzyżyk</title>
    <link rel="stylesheet" href="styles-common.css">
    <script src="scripts-common.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 25px;
        }

        .home-btn {
            display: inline-block;
            margin-bottom: 15px;
            padding: 8px 16px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .home-btn:hover {
            background: #764ba2;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 5px;
            font-size: 1.5rem;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        /* Settings Panel */
        .settings-panel {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .settings-row {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .settings-row label {
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }

        .settings-row select {
            padding: 8px 12px;
            font-size: 1rem;
            border: 2px solid #667eea;
            border-radius: 8px;
            background: white;
            cursor: pointer;
        }

        .new-game-btn {
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transition: all 0.3s;
        }

        .new-game-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        /* Game Area */
        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Current Player */
        .current-player {
            font-size: 1.2rem;
            font-weight: 700;
            padding: 10px 25px;
            border-radius: 10px;
            text-align: center;
        }

        .current-player.player-x {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
        }

        .current-player.player-o {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
        }

        /* Board */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: #333;
            padding: 8px;
            border-radius: 12px;
        }

        .cell {
            width: 90px;
            height: 90px;
            background: #f0f0f0;
            border: none;
            border-radius: 8px;
            font-size: 3rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell:hover:not(.taken) {
            background: #e0e0e0;
            transform: scale(1.05);
        }

        .cell.taken {
            cursor: not-allowed;
        }

        .cell.x {
            color: #e74c3c;
        }

        .cell.o {
            color: #3498db;
        }

        .cell.winning {
            animation: pulse 0.5s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        /* Round start announcement */
        .round-announcement {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .announcement-content {
            text-align: center;
            color: white;
            animation: scaleIn 0.4s ease-out;
        }

        @keyframes scaleIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .announcement-content .player-symbol {
            font-size: 5rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .announcement-content .player-symbol.x { color: #e74c3c; }
        .announcement-content .player-symbol.o { color: #3498db; }

        .announcement-content .player-text {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .announcement-content .start-text {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.7);
        }

        /* Question Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: modalIn 0.3s ease-out;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-player {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 10px;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
        }

        .modal-player.player-x {
            background: #e74c3c;
            color: white;
        }

        .modal-player.player-o {
            background: #3498db;
            color: white;
        }

        .question {
            font-size: 2.5rem;
            font-weight: 800;
            color: #333;
            margin: 20px 0;
        }

        .answers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .answer-btn {
            padding: 15px;
            font-size: 1.5rem;
            font-weight: 700;
            border: 3px solid #ddd;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .answer-btn:hover {
            border-color: #667eea;
            background: #f0f0ff;
        }

        .answer-btn.correct {
            background: #27ae60;
            border-color: #27ae60;
            color: white;
        }

        .answer-btn.wrong {
            background: #e74c3c;
            border-color: #e74c3c;
            color: white;
        }

        /* Result */
        .result-message {
            display: none;
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .result-message.visible {
            display: block;
            animation: resultIn 0.5s ease-out;
        }

        @keyframes resultIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-message.x-wins {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
        }

        .result-message.o-wins {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
        }

        .result-message.draw {
            background: #95a5a6;
            color: white;
        }

        /* Score */
        .score-board {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            font-size: 0.9rem;
            color: #666;
        }

        .score-value {
            font-size: 1.8rem;
            font-weight: 800;
        }

        .score-value.x { color: #e74c3c; }
        .score-value.o { color: #3498db; }
        .score-value.draw { color: #95a5a6; }

        /* Winner Input */
        .winner-form {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .winner-form.visible {
            display: block;
        }

        .winner-form h3 {
            font-size: 1rem;
            color: #333;
            margin-bottom: 10px;
        }

        .winner-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .winner-inputs input {
            padding: 8px 12px;
            font-size: 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            width: 80px;
            text-align: center;
            text-transform: uppercase;
        }

        .winner-inputs input:focus {
            outline: none;
            border-color: #667eea;
        }

        .winner-inputs input::placeholder {
            text-transform: none;
        }

        .save-btn {
            padding: 8px 20px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #27ae60;
            color: white;
        }

        /* Ranking */
        .ranking-section {
            margin-top: 25px;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }

        .ranking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .ranking-header h2 {
            font-size: 1.2rem;
            color: #333;
        }

        .ranking-actions {
            display: flex;
            gap: 10px;
        }

        .ranking-btn {
            padding: 6px 12px;
            font-size: 0.8rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .export-btn {
            background: #667eea;
            color: white;
        }

        .clear-btn {
            background: #e74c3c;
            color: white;
        }

        .ranking-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .ranking-table th {
            background: #667eea;
            color: white;
            padding: 10px;
            text-align: left;
        }

        .ranking-table th:first-child {
            border-radius: 8px 0 0 0;
        }

        .ranking-table th:last-child {
            border-radius: 0 8px 0 0;
        }

        .ranking-table td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .ranking-table tr:hover {
            background: #f8f9fa;
        }

        .ranking-table .rank-1 { color: #f1c40f; font-weight: bold; }
        .ranking-table .rank-2 { color: #95a5a6; font-weight: bold; }
        .ranking-table .rank-3 { color: #cd6133; font-weight: bold; }

        .empty-ranking {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        .level-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .level-easy { background: #d5f5e3; color: #27ae60; }
        .level-medium { background: #fdebd0; color: #f39c12; }
        .level-hard { background: #fadbd8; color: #e74c3c; }
        .level-master { background: #e8daef; color: #8e44ad; }

        /* Checkbox */
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 600;
            color: #333;
        }

        .checkbox-label input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        /* Timer */
        .timer-display {
            font-size: 2.5rem;
            font-weight: 800;
            color: #e74c3c;
            margin: 10px 0;
            display: none;
        }

        .timer-display.active {
            display: block;
            animation: timer-pulse 1s infinite;
        }

        @keyframes timer-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .timer-display.warning {
            color: #e74c3c;
            animation: timer-warning 0.3s infinite;
        }

        @keyframes timer-warning {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Footer */
        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
        }

        .footer-link a {
            color: #667eea;
        }

        @media (max-width: 500px) {
            .cell {
                width: 75px;
                height: 75px;
                font-size: 2.5rem;
            }

            .question {
                font-size: 2rem;
            }

            .answer-btn {
                padding: 12px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="home-btn">&#8592; Strona główna</a>
        <h1>Quiz Kółko i Krzyżyk</h1>
        <p class="subtitle">Matematyka i Geografia - Gra dla 2 graczy</p>

        <div class="settings-panel">
            <div class="settings-row">
                <label for="topic">Temat:</label>
                <select id="topic" onchange="updateLevelOptions()">
                    <optgroup label="Matematyka">
                        <option value="multiplication" selected>✖️ Tabliczka mnożenia</option>
                        <option value="division">➗ Dzielenie</option>
                        <option value="subtraction">➖ Odejmowanie</option>
                        <option value="powers">🔢 Potęgowanie</option>
                        <option value="roots">√ Pierwiastkowanie</option>
                        <option value="fractions">½ Ułamki</option>
                        <option value="percentages">% Procenty</option>
                        <option value="length_units">📏 Jednostki długości</option>
                        <option value="mass_units">⚖️ Jednostki masy</option>
                    </optgroup>
                    <optgroup label="Geografia">
                        <option value="poland_voivodeships">🇵🇱 Województwa Polski</option>
                        <option value="europe_capitals">🇪🇺 Stolice Europy</option>
                    </optgroup>
                </select>
            </div>
            <div class="settings-row" style="margin-top: 10px;">
                <label for="level">Poziom:</label>
                <select id="level">
                    <option value="easy">🐣 Kurczaczek (1-5)</option>
                    <option value="medium" selected>📚 Uczeń (1-10)</option>
                    <option value="hard">🤖 Tabliczkowy Terminator (1-12)</option>
                    <option value="master">🧠 Mega Mózg (1-20)</option>
                </select>
                <button class="new-game-btn" onclick="newGame()">Nowa gra</button>
            </div>
            <div class="settings-row" style="margin-top: 10px;">
                <label class="checkbox-label">
                    <input type="checkbox" id="lightningMode">
                    <span>⚡ Runda błyskawiczna (3 sekundy)</span>
                </label>
            </div>
        </div>

        <div class="game-area">
            <div class="current-player player-x" id="currentPlayer">Ruch: Gracz X</div>

            <div class="board" id="board">
                <button class="cell" data-index="0"></button>
                <button class="cell" data-index="1"></button>
                <button class="cell" data-index="2"></button>
                <button class="cell" data-index="3"></button>
                <button class="cell" data-index="4"></button>
                <button class="cell" data-index="5"></button>
                <button class="cell" data-index="6"></button>
                <button class="cell" data-index="7"></button>
                <button class="cell" data-index="8"></button>
            </div>

            <div class="result-message" id="resultMessage"></div>

            <div class="winner-form" id="winnerForm">
                <h3>🏆 Zapisz zwycięzcę w rankingu:</h3>
                <div class="winner-inputs">
                    <input type="text" id="winnerInitials" maxlength="3" placeholder="ABC">
                    <input type="text" id="winnerClass" maxlength="4" placeholder="4a">
                    <button class="save-btn" onclick="saveWinner()">Zapisz</button>
                </div>
            </div>

            <div class="score-board">
                <div class="score-item">
                    <div class="score-label">Gracz X</div>
                    <div class="score-value x" id="scoreX">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label">Remisy</div>
                    <div class="score-value draw" id="scoreDraw">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label">Gracz O</div>
                    <div class="score-value o" id="scoreO">0</div>
                </div>
            </div>
        </div>

        <div class="ranking-section">
            <div class="ranking-header">
                <h2>🏆 Ranking Mistrzów</h2>
                <div class="ranking-actions">
                    <button class="ranking-btn export-btn" onclick="exportRanking()">Eksportuj CSV</button>
                    <button class="ranking-btn clear-btn" onclick="clearRanking()">Wyczyść</button>
                </div>
            </div>
            <div id="rankingContent">
                <p class="empty-ranking">Brak zapisanych zwycięstw</p>
            </div>
        </div>

        <div class="footer-link">
            <a href="https://grzegorz-nauczyciel.goatcounter.com" target="_blank">Statystyki odwiedzin</a>
        </div>
    </div>

    <!-- Question Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-player player-x" id="modalPlayer">Gracz X</div>
            <div class="timer-display" id="timerDisplay">3</div>
            <div class="question" id="questionText">7 × 8 = ?</div>
            <div class="answers" id="answersContainer">
                <button class="answer-btn">56</button>
                <button class="answer-btn">54</button>
                <button class="answer-btn">63</button>
                <button class="answer-btn">48</button>
            </div>
        </div>
    </div>

        // Topic definitions with question generators
        const TOPICS = {

                generate: (level) => {

                    let power = level.power;

                    const answer = Math.pow(base, power);
                    const superscript = power === 2 ? '²' : '³';
                    return {

            fractions: {

                    medium: { name: '📚 Podstawowe', fractions: [[1,2], [1,3], [2,3], [1,4], [3,4], [1,5], [2,5]] },
                    hard: { name: '🤖 Rozszerzone', fractions: [[1,2], [1,3], [2,3], [1,4], [3,4], [1,5], [2,5], [3,5], [4,5], [1,6], [5,6]] },
                    master: { name: '🧠 Wszystkie', fractions: [[1,2], [1,3], [2,3], [1,4], [3,4], [1,5], [2,5], [3,5], [4,5], [1,6], [5,6], [1,8], [3,8], [5,8], [7,8]] }
                },
                generate: (level) => {
                    const fracs = level.fractions;
                    const [n1, d1] = fracs[Math.floor(Math.random() * fracs.length)];
                    let [n2, d2] = fracs[Math.floor(Math.random() * fracs.length)];

                    // Ensure same denominator for easy addition
                    if (d1 !== d2) {
                        const commonDenom = d1 * d2;
                        const newN1 = n1 * d2;
                        const newN2 = n2 * d1;
                        const sumN = newN1 + newN2;
                        const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);
                        const g = gcd(sumN, commonDenom);
                        const answerN = sumN / g;
                        const answerD = commonDenom / g;

                        return {
                            question: `${n1}/${d1} + ${n2}/${d2} = ?`,
                            answer: answerD === 1 ? answerN : `${answerN}/${answerD}`,
                            wrongAnswers: [`${answerN + 1}/${answerD}`, `${n1 + n2}/${d1 + d2}`, `${answerN}/${answerD + 1}`, `${n1}/${d1}`],
                            isText: true
                        };
                    } else {
                        const sumN = n1 + n2;
                        const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);
                        const g = gcd(sumN, d1);
                        const answerN = sumN / g;
                        const answerD = d1 / g;

                        return {
                            question: `${n1}/${d1} + ${n2}/${d2} = ?`,
                            answer: answerD === 1 ? answerN : `${answerN}/${answerD}`,
                            wrongAnswers: [`${sumN}/${d1}`, `${n1 + n2}/${d1 * 2}`, `${answerN + 1}/${answerD}`, `${n1}/${d1}`],

                },
                generate: (level) => {

                    master: { name: '🧠 Wszystkie', conversions: [{ from: 'kg', to: 'g', mult: 1000 }, { from: 't', to: 'kg', mult: 1000 }, { from: 'kg', to: 'dag', mult: 100 }, { from: 'dag', to: 'g', mult: 10 }, { from: 't', to: 'g', mult: 1000000 }] }
                },
                generate: (level) => {

                    const answer = value * conv.mult;
                    return {

                        answer: answer,

            },
            poland_voivodeships: {
                name: 'Województwa Polski',
                levels: {
                    easy: { name: '🐣 Główne', count: 8 },
                    medium: { name: '📚 Więcej', count: 12 },
                    hard: { name: '🤖 Wszystkie', count: 16 },
                    master: { name: '🧠 Odwrotnie', count: 16, reverse: true }
                },
                tracker: null,
                getTracker: function(level) {
                    const key = `kolko-krzyzyk-wojewodztwa-${level.count}-${level.reverse ? 'rev' : 'std'}`;
                    if (!this.tracker || this.tracker.categoryId !== key) {
                        const data = POLAND_VOIVODESHIPS.slice(0, level.count);
                        this.tracker = new QuestionTracker(key, data);
                    }
                    return this.tracker;
                },
                generate: function(level) {
                    const data = POLAND_VOIVODESHIPS.slice(0, level.count);
                    const tracker = this.getTracker(level);

                    // Pobierz pytanie z trackera (bez powtórzeń!)
                    const result = tracker.getNextAndMark();
                    const item = result ? result.question : data[Math.floor(Math.random() * data.length)];

                    const others = data.filter(d => d.capital !== item.capital);
                    const wrongCaps = others.sort(() => Math.random() - 0.5).slice(0, 3).map(d => d.capital);

                    if (level.reverse) {
                        const wrongVoi = others.slice(0, 3).map(d => d.voivodeship);

        function updateLevelOptions() {
            const topic = document.getElementById('topic').value;
            const levelSelect = document.getElementById('level');
            const topicData = TOPICS[topic];

            levelSelect.innerHTML = Object.entries(topicData.levels).map(([key, level]) =>
                `<option value="${key}">${level.name}</option>`
            ).join('');

            // Select medium by default if available
            if (topicData.levels.medium) {
                levelSelect.value = 'medium';
            }
        }

        const WIN_PATTERNS = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
            [0, 4, 8], [2, 4, 6] // diagonals
        ];

        // Initialize
        document.querySelectorAll('.cell').forEach(cell => {
            cell.addEventListener('click', () => handleCellClick(cell));
        });

        updateLevelOptions();
        loadRanking();

        // Automatycznie rozpocznij grę po załadowaniu
        setTimeout(() => {
            newGame();
        }, 500);

        function handleCellClick(cell) {
            // Blokuj kliknięcia gdy gra nieaktywna lub trwa przetwarzanie
            if (!gameActive || isProcessing || isModalOpen) return;

            const index = parseInt(cell.dataset.index);
            if (board[index] !== '') return;

            isProcessing = true;
            selectedCell = index;
            showQuestion();
        }

        // Funkcja do bezpiecznego czyszczenia timera
        function clearTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            const timerDisplay = document.getElementById('timerDisplay');
            if (timerDisplay) {
                timerDisplay.classList.remove('active', 'warning');
            }
        }

        function showQuestion() {
            // Zabezpieczenie przed wielokrotnym otwarciem
            if (isModalOpen) return;

            const topic = document.getElementById('topic').value;
            const levelKey = document.getElementById('level').value;
            const topicData = TOPICS[topic];
            const level = topicData.levels[levelKey];

            // Generate question using topic generator
            let q;
            try {
                q = topicData.generate(level);
            } catch (e) {
                console.error('Błąd generowania pytania:', e);
                isProcessing = false;
                return;
            }

            correctAnswer = q.answer;
            const isTextAnswer = q.isText || false;

            // Build answers array
            const answers = [q.answer];
            const wrongAnswers = (q.wrongAnswers || []).filter(w =>
                w !== q.answer &&
                w !== null &&
                w !== undefined &&
                (typeof w === 'string' || w > 0)
            );

            // Add unique wrong answers
            for (const wrong of wrongAnswers) {
                if (answers.length >= 4) break;
                if (!answers.includes(wrong)) {
                    answers.push(wrong);
                }
            }

            // Fill remaining with variations if needed
            let counter = 1;
            while (answers.length < 4) {
                const filler = isTextAnswer ? `Opcja ${counter}` : (typeof q.answer === 'number' ? q.answer + counter * 3 : counter);
                if (!answers.includes(filler)) {
                    answers.push(filler);
                }
                counter++;
                if (counter > 20) break; // Zabezpieczenie przed nieskończoną pętlą
            }

            // Shuffle answers
            answers.sort(() => Math.random() - 0.5);

            // Update modal
            document.getElementById('questionText').textContent = q.question;

            const modalPlayer = document.getElementById('modalPlayer');
            modalPlayer.textContent = `Gracz ${currentPlayer}`;
            modalPlayer.className = `modal-player player-${currentPlayer.toLowerCase()}`;

            const container = document.getElementById('answersContainer');
            container.innerHTML = '';

            answers.forEach(ans => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = ans;
                if (isTextAnswer) {
                    btn.style.fontSize = '1rem';
                }
                btn.addEventListener('click', function() {
                    checkAnswer(isTextAnswer ? ans : Number(ans));
                }, { once: true }); // once: true zapobiega wielokrotnemu kliknięciu
                container.appendChild(btn);
            });

            isModalOpen = true;
            document.getElementById('modalOverlay').classList.add('active');

            // Start timer if lightning mode is enabled
            const lightningMode = document.getElementById('lightningMode').checked;
            const timerDisplay = document.getElementById('timerDisplay');

            clearTimer(); // Wyczyść poprzedni timer

            if (lightningMode) {
                timeLeft = 3;
                timerDisplay.textContent = timeLeft;
                timerDisplay.classList.add('active');
                timerDisplay.classList.remove('warning');

                timerInterval = setInterval(() => {
                    timeLeft--;
                    timerDisplay.textContent = timeLeft;

                    if (timeLeft <= 1) {
                        timerDisplay.classList.add('warning');
                    }

                    if (timeLeft <= 0) {
                        clearTimer();
                        checkAnswer(-1); // -1 indicates timeout
                    }
                }, 1000);
            } else {
                timerDisplay.classList.remove('active');
            }
        }

        function checkAnswer(answer) {
            // Zabezpieczenie przed wielokrotnym wywołaniem
            if (!isModalOpen) return;

            clearTimer();

            const buttons = document.querySelectorAll('.answer-btn');
            const isTextAnswer = typeof correctAnswer === 'string';

            // Wyłącz wszystkie przyciski
            buttons.forEach(btn => {
                btn.disabled = true;
                btn.style.pointerEvents = 'none';

                const btnValue = isTextAnswer ? btn.textContent : parseInt(btn.textContent);
                if (btnValue === correctAnswer || btn.textContent === String(correctAnswer)) {
                    btn.classList.add('correct');
                } else if ((btnValue === answer || btn.textContent === String(answer)) && answer !== correctAnswer) {
                    btn.classList.add('wrong');
                }
            });

            // Handle timeout (answer = -1)
            const isTimeout = answer === -1;
            const isCorrect = answer === correctAnswer || String(answer) === String(correctAnswer);

            const delay = isTimeout ? 300 : 800;

            setTimeout(() => {
                isModalOpen = false;
                document.getElementById('modalOverlay').classList.remove('active');

                // Krótkie opóźnienie przed następną akcją
                setTimeout(() => {
                    if (isCorrect) {
                        placeMarker();
                    } else {
                        switchPlayer();
                    }
                    isProcessing = false;
                }, 100);
            }, delay);
        }

        function placeMarker() {
            if (selectedCell === null || selectedCell < 0 || selectedCell > 8) return;

            board[selectedCell] = currentPlayer;
            const cell = document.querySelector(`[data-index="${selectedCell}"]`);
            if (cell) {
                cell.textContent = currentPlayer;
                cell.classList.add('taken', currentPlayer.toLowerCase());
            }

            if (checkWin()) {
                gameActive = false;
                isProcessing = false;
                highlightWinningCells();
                showResult(`Wygrywa Gracz ${currentPlayer}! 🎉`);
                scores[currentPlayer]++;
                lastWinner = currentPlayer;
                updateScores();
                showWinnerForm();
            } else if (board.every(c => c !== '')) {
                gameActive = false;
                isProcessing = false;
                showResult('Remis! 🤝');
                scores.draw++;
                lastWinner = null;
                updateScores();
            } else {
                switchPlayer();
            }
        }

        function switchPlayer() {
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateCurrentPlayerDisplay();
        }

        function updateCurrentPlayerDisplay() {
            const display = document.getElementById('currentPlayer');
            display.textContent = `Ruch: Gracz ${currentPlayer}`;
            display.className = `current-player player-${currentPlayer.toLowerCase()}`;
        }

        function showRoundAnnouncement(player, callback) {
            // Usuń poprzednie ogłoszenia
            document.querySelectorAll('.round-announcement').forEach(el => el.remove());

            const announcement = document.createElement('div');
            announcement.className = 'round-announcement';
            announcement.innerHTML = `
                <div class="announcement-content">
                    <div class="player-symbol ${player.toLowerCase()}">${player}</div>
                    <div class="player-text">Gracz ${player}</div>
                    <div class="start-text">zaczyna rundę!</div>
                </div>
            `;
            document.body.appendChild(announcement);

            // Użyj requestAnimationFrame dla płynniejszej animacji
            setTimeout(() => {
                if (announcement.parentNode) {
                    announcement.style.opacity = '0';
                    announcement.style.transition = 'opacity 0.3s';
                    setTimeout(() => {
                        if (announcement.parentNode) {
                            announcement.remove();
                        }
                        if (callback) callback();
                    }, 300);
                } else if (callback) {
                    callback();
                }
            }, 1500);
        }

        function checkWin() {
            return WIN_PATTERNS.some(pattern => {
                return pattern.every(index => board[index] === currentPlayer);
            });
        }

        function highlightWinningCells() {
            WIN_PATTERNS.forEach(pattern => {
                if (pattern.every(index => board[index] === currentPlayer)) {
                    pattern.forEach(index => {
                        document.querySelector(`[data-index="${index}"]`).classList.add('winning');
                    });
                }
            });
        }

        function showResult(message) {
            const resultDiv = document.getElementById('resultMessage');
            resultDiv.textContent = message;
            resultDiv.className = 'result-message visible';

            if (message.includes('X')) {
                resultDiv.classList.add('x-wins');
            } else if (message.includes('O')) {
                resultDiv.classList.add('o-wins');
            } else {
                resultDiv.classList.add('draw');
            }
        }

        function showWinnerForm() {
            document.getElementById('winnerForm').classList.add('visible');
            document.getElementById('winnerInitials').focus();
        }

        function updateScores() {
            document.getElementById('scoreX').textContent = scores.X;
            document.getElementById('scoreO').textContent = scores.O;
            document.getElementById('scoreDraw').textContent = scores.draw;
        }

        function newGame() {
            // Zatrzymaj wszystko
            gameActive = false;
            isProcessing = false;
            isModalOpen = false;
            clearTimer();

            // Reset stanu gry
            board = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            selectedCell = null;
            lastWinner = null;

            // Wyczyść planszę
            document.querySelectorAll('.cell').forEach(cell => {
                cell.textContent = '';
                cell.className = 'cell';
            });

            // Ukryj elementy UI
            document.getElementById('modalOverlay').classList.remove('active');
            document.getElementById('resultMessage').className = 'result-message';
            document.getElementById('winnerForm').classList.remove('visible');
            updateCurrentPlayerDisplay();

            // Usuń poprzednie ogłoszenia jeśli istnieją
            document.querySelectorAll('.round-announcement').forEach(el => el.remove());

            // Pokaż ogłoszenie kto zaczyna
            showRoundAnnouncement('X', () => {
                gameActive = true;
                isProcessing = false;
            });
        }

        // Ranking functions
        function saveWinner() {
            const initials = document.getElementById('winnerInitials').value.trim().toUpperCase();
            const playerClass = document.getElementById('winnerClass').value.trim().toLowerCase();

            if (!initials) {
                alert('Wpisz inicjały!');
                return;
            }

            const topic = document.getElementById('topic').value;
            const level = document.getElementById('level').value;
            const ranking = getRanking();

            const key = `${initials}-${playerClass}-${topic}-${level}`;
            const existing = ranking.find(r => r.key === key);

            if (existing) {
                existing.wins++;
                existing.date = new Date().toISOString();
            } else {
                ranking.push({
                    key,
                    initials,
                    class: playerClass || '-',
                    topic,
                    level,
                    wins: 1,
                    date: new Date().toISOString()
                });
            }

            localStorage.setItem('ttt-ranking', JSON.stringify(ranking));
            loadRanking();

            document.getElementById('winnerForm').classList.remove('visible');
            document.getElementById('winnerInitials').value = '';
            document.getElementById('winnerClass').value = '';
        }

        function getRanking() {
            try {
                return JSON.parse(localStorage.getItem('ttt-ranking')) || [];
            } catch {
                return [];
            }
        }

        function loadRanking() {
            const ranking = getRanking();
            const container = document.getElementById('rankingContent');

            if (ranking.length === 0) {
                container.innerHTML = '<p class="empty-ranking">Brak zapisanych zwycięstw</p>';
                return;
            }

            // Sort by wins descending
            ranking.sort((a, b) => b.wins - a.wins);

            const levelClasses = {
                easy: 'level-easy',
                medium: 'level-medium',
                hard: 'level-hard',
                master: 'level-master'
            };

            let html = `
                <table class="ranking-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Gracz</th>
                            <th>Klasa</th>
                            <th>Temat</th>
                            <th>Wygrane</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            ranking.slice(0, 20).forEach((entry, index) => {
                const rankClass = index < 3 ? `rank-${index + 1}` : '';
                const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : (index + 1);

                // Get topic name - handle old entries without topic
                const topicName = entry.topic && TOPICS[entry.topic]
                    ? TOPICS[entry.topic].name
                    : (LEVELS[entry.level] ? LEVELS[entry.level].name : entry.level);

                html += `
                    <tr>
                        <td class="${rankClass}">${medal}</td>
                        <td><strong>${entry.initials}</strong></td>
                        <td>${entry.class}</td>
                        <td><span class="level-badge ${levelClasses[entry.level]}">${topicName}</span></td>
                        <td><strong>${entry.wins}</strong></td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function exportRanking() {
            const ranking = getRanking();
            if (ranking.length === 0) {
                alert('Ranking jest pusty!');
                return;
            }

            ranking.sort((a, b) => b.wins - a.wins);

            let csv = 'Miejsce,Inicjały,Klasa,Temat,Poziom,Wygrane\n';
            ranking.forEach((entry, index) => {
                const topicName = entry.topic && TOPICS[entry.topic] ? TOPICS[entry.topic].name : 'Tabliczka mnożenia';
                const levelName = entry.topic && TOPICS[entry.topic] && TOPICS[entry.topic].levels[entry.level]
                    ? TOPICS[entry.topic].levels[entry.level].name
                    : entry.level;
                csv += `${index + 1},${entry.initials},${entry.class},${topicName},${levelName},${entry.wins}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'ranking-quiz.csv';
            link.click();
        }

        function clearRanking() {
            if (confirm('Czy na pewno chcesz wyczyścić cały ranking?')) {
                localStorage.removeItem('ttt-ranking');
                loadRanking();
            }
        }
    </script>
