<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>
  <!-- Book icon -->
  <g transform="translate(96, 96)">
    <!-- Open book -->
    <path d="M160 40 L160 280 Q120 260 40 260 L40 40 Q120 40 160 60" fill="#fff" opacity="0.9"/>
    <path d="M160 40 L160 280 Q200 260 280 260 L280 40 Q200 40 160 60" fill="#fff" opacity="0.95"/>
    <!-- Book spine -->
    <line x1="160" y1="40" x2="160" y2="280" stroke="#667eea" stroke-width="4"/>
    <!-- Page lines left -->
    <line x1="60" y1="80" x2="140" y2="90" stroke="#667eea" stroke-width="3" opacity="0.3"/>
    <line x1="60" y1="110" x2="140" y2="120" stroke="#667eea" stroke-width="3" opacity="0.3"/>
    <line x1="60" y1="140" x2="140" y2="150" stroke="#667eea" stroke-width="3" opacity="0.3"/>
    <line x1="60" y1="170" x2="140" y2="180" stroke="#667eea" stroke-width="3" opacity="0.3"/>
    <!-- Page lines right -->
    <line x1="180" y1="90" x2="260" y2="80" stroke="#764ba2" stroke-width="3" opacity="0.3"/>
    <line x1="180" y1="120" x2="260" y2="110" stroke="#764ba2" stroke-width="3" opacity="0.3"/>
    <line x1="180" y1="150" x2="260" y2="140" stroke="#764ba2" stroke-width="3" opacity="0.3"/>
    <line x1="180" y1="180" x2="260" y2="170" stroke="#764ba2" stroke-width="3" opacity="0.3"/>
  </g>
  <!-- Star -->
  <polygon points="400,80 410,110 442,110 416,130 426,162 400,142 374,162 384,130 358,110 390,110" fill="#ffd700"/>
</svg>
