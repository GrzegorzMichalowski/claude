<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Moderatora - Narzędzia dla Nauczycieli</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="styles-common.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
            padding: var(--spacing-lg);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #ffd700;
            margin-bottom: var(--spacing-xl);
        }

        /* Login Panel */
        .login-panel {
            max-width: 400px;
            margin: 100px auto;
            background: rgba(255,255,255,0.1);
            padding: var(--spacing-xl);
            border-radius: var(--radius-lg);
            text-align: center;
        }

        .login-panel input {
            width: 100%;
            padding: var(--spacing-md);
            margin: var(--spacing-md) 0;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: var(--radius-md);
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: var(--font-size-base);
        }

        .login-panel input:focus {
            outline: none;
            border-color: #ffd700;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-xl);
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            padding: var(--spacing-sm) var(--spacing-lg);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: var(--radius-full);
            background: transparent;
            color: rgba(255,255,255,0.8);
            font-size: var(--font-size-base);
            cursor: pointer;
            transition: var(--transition-normal);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .tab-btn:hover {
            border-color: #ffd700;
        }

        .tab-btn.active {
            background: #ffd700;
            color: #1a1a2e;
            border-color: #ffd700;
        }

        .badge {
            background: #e74c3c;
            color: white;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-size: var(--font-size-xs);
            font-weight: bold;
        }

        .tab-btn.active .badge {
            background: #1a1a2e;
            color: #ffd700;
        }

        /* Panel */
        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        /* Set Cards */
        .sets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--spacing-lg);
        }

        .set-card {
            background: rgba(255,255,255,0.1);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            border: 2px solid transparent;
        }

        .set-card h3 {
            color: #ffd700;
            margin-bottom: var(--spacing-sm);
        }

        .set-card .author {
            font-size: var(--font-size-sm);
            opacity: 0.8;
            margin-bottom: var(--spacing-sm);
        }

        .set-card .meta {
            font-size: var(--font-size-sm);
            opacity: 0.6;
            margin-bottom: var(--spacing-md);
        }

        .set-card .preview {
            background: rgba(0,0,0,0.2);
            padding: var(--spacing-sm);
            border-radius: var(--radius-md);
            font-size: var(--font-size-sm);
            margin-bottom: var(--spacing-md);
            max-height: 100px;
            overflow-y: auto;
        }

        .btn-group {
            display: flex;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
        }

        .btn {
            padding: var(--spacing-sm) var(--spacing-md);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: var(--font-size-sm);
            transition: var(--transition-normal);
        }

        .btn-approve {
            background: #27ae60;
            color: white;
        }

        .btn-reject {
            background: #e74c3c;
            color: white;
        }

        .btn-preview {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            padding: var(--spacing-xl);
            opacity: 0.7;
        }

        /* Stats */
        .stats {
            display: flex;
            gap: var(--spacing-lg);
            justify-content: center;
            margin-bottom: var(--spacing-xl);
            flex-wrap: wrap;
        }

        .stat-box {
            background: rgba(255,255,255,0.1);
            padding: var(--spacing-md) var(--spacing-xl);
            border-radius: var(--radius-md);
            text-align: center;
        }

        .stat-box .number {
            font-size: 2rem;
            font-weight: bold;
            color: #ffd700;
        }

        .stat-box .label {
            font-size: var(--font-size-sm);
            opacity: 0.8;
        }

        .home-btn {
            display: inline-block;
            margin-bottom: var(--spacing-lg);
            padding: var(--spacing-sm) var(--spacing-md);
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: var(--radius-md);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="home-btn">&#8592; Strona główna</a>

        <!-- Login Panel -->
        <div id="loginPanel" class="login-panel">
            <h2 style="color: #ffd700; margin-bottom: var(--spacing-lg);">🔐 Panel Moderatora</h2>
            <p style="margin-bottom: var(--spacing-lg); opacity: 0.8;">Zaloguj się aby zarządzać zestawami</p>
            <input type="password" id="adminPassword" placeholder="Hasło administratora" onkeypress="if(event.key==='Enter')login()">
            <button class="btn btn-approve" onclick="login()" style="width: 100%; padding: var(--spacing-md);">Zaloguj</button>
        </div>

        <!-- Main Panel (hidden until login) -->
        <div id="mainPanel" style="display: none;">
            <h1>Panel Moderatora</h1>

            <div class="stats">
                <div class="stat-box">
                    <div class="number" id="totalPending">0</div>
                    <div class="label">Do sprawdzenia</div>
                </div>
                <div class="stat-box">
                    <div class="number" id="totalApproved">0</div>
                    <div class="label">Zatwierdzonych</div>
                </div>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="showTab('milionerzy')">
                    💰 Milionerzy <span class="badge" id="badgeMilionerzy">0</span>
                </button>
                <button class="tab-btn" onclick="showTab('fiszki')">
                    📚 Fiszki <span class="badge" id="badgeFiszki">0</span>
                </button>
                <button class="tab-btn" onclick="showTab('vabanque')">
                    🎯 Va Banque <span class="badge" id="badgeVabanque">0</span>
                </button>
            </div>

            <div id="milionerzy" class="panel active">
                <div class="sets-grid" id="gridMilionerzy">
                    <div class="empty-state">Ładowanie...</div>
                </div>
            </div>

            <div id="fiszki" class="panel">
                <div class="sets-grid" id="gridFiszki">
                    <div class="empty-state">Ładowanie...</div>
                </div>
            </div>

            <div id="vabanque" class="panel">
                <div class="sets-grid" id="gridVabanque">
                    <div class="empty-state">Ładowanie...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA-dummy-key-for-rtdb",
            authDomain: "turniej-tabliczka.firebaseapp.com",
            databaseURL: "https://turniej-tabliczka-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "turniej-tabliczka",
            storageBucket: "turniej-tabliczka.firebasestorage.app",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abc123"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isLoggedIn = false;
        let pendingSets = {
            milionerzy: [],
            fiszki: [],
            vabanque: []
        };

        // Simple hash function for password
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password + 'milionerzy_salt_2024');
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function login() {
            const password = document.getElementById('adminPassword').value;
            if (!password) {
                alert('Podaj hasło!');
                return;
            }

            const hash = await hashPassword(password);

            try {
                const snapshot = await db.ref('adminConfig/passwordHash').once('value');
                let storedHash = snapshot.val();

                // If no hash stored, set default (first login)
                if (!storedHash) {
                    const defaultHash = await hashPassword('admin123');
                    await db.ref('adminConfig/passwordHash').set(defaultHash);
                    storedHash = defaultHash;
                }

                if (hash === storedHash) {
                    isLoggedIn = true;
                    document.getElementById('loginPanel').style.display = 'none';
                    document.getElementById('mainPanel').style.display = 'block';
                    loadAllSets();
                } else {
                    alert('Nieprawidłowe hasło!');
                }
            } catch (error) {
                console.error('Błąd logowania:', error);
                alert('Błąd logowania. Sprawdź połączenie.');
            }
        }

        function showTab(tabId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        async function loadAllSets() {
            await Promise.all([
                loadPendingSets('communityQuizSets', 'milionerzy'),
                loadPendingSets('communityFiszkiSets', 'fiszki'),
                loadPendingSets('communityVabanqueSets', 'vabanque')
            ]);
            updateStats();
        }

        async function loadPendingSets(collection, type) {
            const grid = document.getElementById('grid' + type.charAt(0).toUpperCase() + type.slice(1));

            try {
                const snapshot = await db.ref(collection).orderByChild('status').equalTo('pending').once('value');

                if (!snapshot.exists()) {
                    pendingSets[type] = [];
                    grid.innerHTML = '<div class="empty-state">Brak zestawów do sprawdzenia</div>';
                    return;
                }

                const sets = [];
                snapshot.forEach(child => {
                    sets.push({ id: child.key, ...child.val(), collection });
                });

                pendingSets[type] = sets;
                renderSets(type, sets);

            } catch (error) {
                console.error('Błąd:', error);
                grid.innerHTML = '<div class="empty-state">Błąd ładowania</div>';
            }
        }

        function renderSets(type, sets) {
            const grid = document.getElementById('grid' + type.charAt(0).toUpperCase() + type.slice(1));

            if (sets.length === 0) {
                grid.innerHTML = '<div class="empty-state">Brak zestawów do sprawdzenia</div>';
                return;
            }

            grid.innerHTML = sets.map(set => {
                let preview = '';
                let itemCount = '';

                if (type === 'milionerzy') {
                    preview = set.questions ? set.questions.slice(0, 2).map(q => `• ${q.question}`).join('<br>') : '';
                    itemCount = `${set.questions?.length || 0} pytań`;
                } else if (type === 'fiszki') {
                    preview = set.cards ? set.cards.slice(0, 3).map(c => `• ${c.front} → ${c.back}`).join('<br>') : '';
                    itemCount = `${set.cards?.length || 0} fiszek`;
                } else if (type === 'vabanque') {
                    preview = set.categories ? set.categories.slice(0, 2).map(c => `• ${c.name}`).join('<br>') : '';
                    itemCount = `${set.categories?.length || 0} kategorii`;
                }

                return `
                    <div class="set-card">
                        <h3>${escapeHtml(set.name)}</h3>
                        <div class="author">👤 ${escapeHtml(set.author)}</div>
                        <div class="meta">${itemCount} | ${new Date(set.createdAt).toLocaleDateString('pl-PL')}</div>
                        <div class="preview">${preview || 'Brak podglądu'}</div>
                        <div class="btn-group">
                            <button class="btn btn-approve" onclick="approveSet('${set.collection}', '${set.id}')">✓ Zatwierdź</button>
                            <button class="btn btn-reject" onclick="rejectSet('${set.collection}', '${set.id}')">✗ Odrzuć</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function approveSet(collection, setId) {
            if (!confirm('Zatwierdzić ten zestaw?')) return;

            try {
                await db.ref(collection + '/' + setId + '/status').set('approved');
                alert('Zestaw zatwierdzony!');
                loadAllSets();
            } catch (error) {
                console.error('Błąd:', error);
                alert('Błąd zatwierdzania.');
            }
        }

        async function rejectSet(collection, setId) {
            if (!confirm('Odrzucić i usunąć ten zestaw?')) return;

            try {
                await db.ref(collection + '/' + setId).remove();
                alert('Zestaw usunięty.');
                loadAllSets();
            } catch (error) {
                console.error('Błąd:', error);
                alert('Błąd usuwania.');
            }
        }

        function updateStats() {
            const totalPending = pendingSets.milionerzy.length + pendingSets.fiszki.length + pendingSets.vabanque.length;
            document.getElementById('totalPending').textContent = totalPending;

            document.getElementById('badgeMilionerzy').textContent = pendingSets.milionerzy.length;
            document.getElementById('badgeFiszki').textContent = pendingSets.fiszki.length;
            document.getElementById('badgeVabanque').textContent = pendingSets.vabanque.length;

            // Load approved count
            loadApprovedCount();
        }

        async function loadApprovedCount() {
            let total = 0;
            const collections = ['communityQuizSets', 'communityFiszkiSets', 'communityVabanqueSets'];

            for (const col of collections) {
                try {
                    const snapshot = await db.ref(col).orderByChild('status').equalTo('approved').once('value');
                    if (snapshot.exists()) {
                        snapshot.forEach(() => total++);
                    }
                } catch (e) {}
            }

            document.getElementById('totalApproved').textContent = total;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }
    </script>
</body>
</html>
